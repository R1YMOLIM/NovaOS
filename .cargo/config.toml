# .cargo/config.toml
[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=-T.cargo/linker.ld", # settings to link
    "-C", "link-arg=--no-pie",
    "-C", "relocation-model=pic", # Generates code that is independent of specific addresses and uses relative addresses where possible.
    "-C", "panic=abort", # Rust won't unwind stack at kernel panic
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"] 
